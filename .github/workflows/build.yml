name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK packages
        shell: pwsh
        run: |
          $sdk = $env:ANDROID_HOME
          if (-not $sdk) { $sdk = $env:ANDROID_SDK_ROOT }
          if (-not $sdk) { throw "Android SDK path not found" }
          Write-Host "SDK: $sdk"
          $sdkmanager = Join-Path $sdk "cmdline-tools\latest\bin\sdkmanager.bat"
          if (-not (Test-Path $sdkmanager)) {
            # cmdline-tools may be under a versioned directory on the runner.
            $candidate = Get-ChildItem (Join-Path $sdk "cmdline-tools") -Filter sdkmanager.bat -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($candidate) { $sdkmanager = $candidate.FullName }
          }
          if (-not (Test-Path $sdkmanager)) { throw "sdkmanager not found under $sdk" }
          & $sdkmanager "platforms;android-35" "build-tools;35.0.0"
          if ($LASTEXITCODE -ne 0) { throw "sdkmanager failed" }

      - name: Fetch build dependencies
        shell: pwsh
        run: |
          python scripts/fetch_deps.py

      - name: Decode signing keystore
        shell: pwsh
        env:
          SIGNING_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE }}
        run: |
          if (-not $env:SIGNING_KEYSTORE) { throw "SIGNING_KEYSTORE secret is missing" }
          $dir = Join-Path $env:RUNNER_TEMP "xreal-signing"
          New-Item -ItemType Directory -Force $dir | Out-Null
          $path = Join-Path $dir "local.keystore"
          [System.IO.File]::WriteAllBytes($path, [System.Convert]::FromBase64String($env:SIGNING_KEYSTORE))
          "KEYSTORE=$path" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run Java tests
        shell: pwsh
        run: |
          # windows-latest has Git for Windows under C:\Program Files\Git\usr\bin.
          # Without this, "bash" resolves to the WSL stub in system32 and the
          # staging integration test fails ("no installed distributions").
          $gitBash = "C:\Program Files\Git\usr\bin\bash.exe"
          if (Test-Path $gitBash) {
            $env:PATH = "C:\Program Files\Git\usr\bin;$env:PATH"
            $env:XREAL_TEST_BASH = $gitBash
          } else {
            $candidate = Get-ChildItem "C:\Program Files\Git" -Filter bash.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($candidate) {
              $env:PATH = "$($candidate.DirectoryName);$env:PATH"
              $env:XREAL_TEST_BASH = $candidate.FullName
            }
          }
          $sdk = $env:ANDROID_HOME
          if (-not $sdk) { $sdk = $env:ANDROID_SDK_ROOT }
          $androidJar = Join-Path $sdk "platforms\android-35\android.jar"
          $out = Join-Path $env:RUNNER_TEMP "xreal-tests"
          New-Item -ItemType Directory -Force $out | Out-Null
          $names = @('AudioSilenceDetector','GlassesCommandProtocol','GlassesLivePlan',
                     'GlassesRecoveryPlan','GlassesStartupPlan','GyroCsvFormatter','GyroflowProto',
                     'ImuReportParser','SessionStats','TcpDriftGate',
                     'TcpReadProgress','TcpTimestampRecovery','UsbMicrophoneSelector',
                     'VideoProgressWatchdog','VideoWriter')
          $src = $names | ForEach-Object { "app\src\com\syameimarukoa\xreal_recorder\$_.java" }
          $tests = Get-ChildItem tests\*Test.java | ForEach-Object { $_.FullName }
          & javac -cp $androidJar -d $out ($src + $tests)
          if ($LASTEXITCODE -ne 0) { throw "test compilation failed" }
          foreach ($file in Get-ChildItem tests\*Test.java) {
            & java -cp $out "com.syameimarukoa.xreal_recorder.$($file.BaseName)"
            if ($LASTEXITCODE -ne 0) { throw "test failed: $($file.BaseName)" }
          }

      - name: Build APK
        shell: pwsh
        run: |
          ./scripts/build.ps1
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: xreal-recorder
          path: build/xreal-recorder.apk
          if-no-files-found: error
